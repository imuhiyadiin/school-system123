<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Offline | Creative Readers</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8fafc; color: #172033; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 1.6rem; }
      p { color: #64748b; }
      button { margin-top: 12px; border: 0; border-radius: 10px; padding: 12px 18px; background: #27272a; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Reconnect to the internet and try again. Your school records will load when a connection is available.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
